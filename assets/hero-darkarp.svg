<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712"></stop>
      <stop offset="45%" stop-color="#030A14"></stop>
      <stop offset="100%" stop-color="#020617"></stop>
    </linearGradient>

    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B0E2E" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#8B0E2E" stop-opacity="0"></stop>
    </linearGradient>

    <linearGradient id="blueGlow" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"></stop>
    </linearGradient>

    <linearGradient id="violetGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"></stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"></stop>
    </linearGradient>

    <linearGradient id="scanline" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"></stop>
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.28"></stop>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"></feGaussianBlur>
    </filter>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"></path>
    </pattern>

    <mask id="fadeMask">
      <rect width="1200" height="320" fill="url(#bg)"></rect>
      <rect width="1200" height="320" fill="url(#grid)"></rect>
    </mask>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" rx="26" fill="url(#bg)"></rect>

  <!-- subtle grid -->
  <rect width="1200" height="320" rx="26" fill="url(#grid)"></rect>

  <!-- corner glow masses -->
  <ellipse cx="260" cy="70" rx="240" ry="90" fill="url(#redGlow)" filter="url(#softBlur)"></ellipse>
  <ellipse cx="940" cy="88" rx="270" ry="110" fill="url(#blueGlow)" filter="url(#softBlur)"></ellipse>
  <ellipse cx="1040" cy="210" rx="180" ry="80" fill="url(#violetGlow)" filter="url(#softBlur)"></ellipse>

  <!-- angular cyber shards -->
  <path d="M0 34 L220 34 L470 158 L140 158 Z" fill="#7F1D1D" fill-opacity="0.15"></path>
  <path d="M810 26 L1200 26 L1200 182 L980 126 Z" fill="#0C4A6E" fill-opacity="0.18"></path>
  <path d="M880 196 L1200 144 L1200 320 L760 320 Z" fill="#4C1D95" fill-opacity="0.12"></path>

  <!-- circuit lines left -->
  <g opacity="0.55">
    <path d="M88 112 H220 V142 H284" stroke="#FB7185" stroke-width="2"></path>
    <circle cx="88" cy="112" r="4" fill="#FB7185"></circle>
    <circle cx="220" cy="142" r="4" fill="#FB7185"></circle>
    <circle cx="284" cy="142" r="4" fill="#FB7185"></circle>

    <path d="M52 210 H176 V182 H238 V228 H310" stroke="#38BDF8" stroke-width="2"></path>
    <circle cx="52" cy="210" r="4" fill="#38BDF8"></circle>
    <circle cx="176" cy="182" r="4" fill="#38BDF8"></circle>
    <circle cx="238" cy="228" r="4" fill="#38BDF8"></circle>
    <circle cx="310" cy="228" r="4" fill="#38BDF8"></circle>
  </g>

  <!-- circuit lines right -->
  <g opacity="0.55">
    <path d="M1110 100 H1006 V136 H946" stroke="#38BDF8" stroke-width="2"></path>
    <circle cx="1110" cy="100" r="4" fill="#38BDF8"></circle>
    <circle cx="1006" cy="136" r="4" fill="#38BDF8"></circle>
    <circle cx="946" cy="136" r="4" fill="#38BDF8"></circle>

    <path d="M1144 220 H1038 V194 H962 V244 H898" stroke="#C084FC" stroke-width="2"></path>
    <circle cx="1144" cy="220" r="4" fill="#C084FC"></circle>
    <circle cx="1038" cy="194" r="4" fill="#C084FC"></circle>
    <circle cx="962" cy="244" r="4" fill="#C084FC"></circle>
    <circle cx="898" cy="244" r="4" fill="#C084FC"></circle>
  </g>

  <!-- central glow -->
  <ellipse cx="600" cy="138" rx="185" ry="64" fill="#0EA5E9" fill-opacity="0.08" filter="url(#softBlur)"></ellipse>
  <ellipse cx="560" cy="132" rx="110" ry="44" fill="#EF4444" fill-opacity="0.06" filter="url(#softBlur)"></ellipse>
  <ellipse cx="670" cy="144" rx="120" ry="48" fill="#7C3AED" fill-opacity="0.05" filter="url(#softBlur)"></ellipse>

  <!-- animated scan line -->
  <rect x="-500" y="0" width="500" height="320" fill="url(#scanline)" opacity="0.9">
    <animate attributeName="x" values="-500;1200" dur="5.2s" repeatCount="indefinite"></animate>
  </rect>

  <!-- top and bottom accent lines -->
  <rect x="38" y="36" width="320" height="2" fill="#FB7185" fill-opacity="0.55"></rect>
  <rect x="842" y="36" width="320" height="2" fill="#38BDF8" fill-opacity="0.55"></rect>
  <rect x="60" y="282" width="220" height="2" fill="#94A3B8" fill-opacity="0.22"></rect>
  <rect x="920" y="282" width="220" height="2" fill="#94A3B8" fill-opacity="0.22"></rect>

  <!-- center name -->
  <text x="600" y="146" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#E6EDF3" letter-spacing="-1.4">
    DarkArp
  </text>

  <!-- subtitle -->
  <text x="600" y="192" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="18" font-weight="700" fill="#CBD5E1" letter-spacing="0.4">
    offense × defense × reverse engineering
  </text>

  <!-- small blinking cursor accent -->
  <rect x="806" y="176" width="10" height="18" rx="1.5" fill="#38BDF8" opacity="0.85">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1s" repeatCount="indefinite"></animate>
  </rect>

  <!-- subtle border -->
  <rect x="1" y="1" width="1198" height="318" rx="25" stroke="#94A3B8" stroke-opacity="0.10" fill="none"></rect>
</svg>
